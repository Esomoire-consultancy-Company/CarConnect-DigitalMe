apply plugin: "com.android.application"
apply plugin: "org.jetbrains.kotlin.android"
apply plugin: "com.facebook.react"

apply from: project(':react-native-config').projectDir.getPath() + "/dotenv.gradle"


def keystoreFile = file("./jellify.keystore")
def keystoreExists = keystoreFile.exists()
def envKeystorePassword = System.getenv("KEYSTORE_PASSWORD")
def envKeyAlias = System.getenv("KEY_ALIAS")
def envKeyPassword = System.getenv("KEY_PASSWORD")

react {
    autolinkLibrariesWithApp()
}

def enableProguardInReleaseBuilds = true
def enableSeparateBuildPerCPUArchitecture = true

def reactNativeArchitectures() {
    def value = project.getProperties().get("reactNativeArchitectures")
    return value ? value.split(",") : ["armeabi-v7a", "x86", "x86_64", "arm64-v8a"]
}

android {
    ndkVersion rootProject.ext.ndkVersion
    buildToolsVersion rootProject.ext.buildToolsVersion
    compileSdk rootProject.ext.compileSdkVersion

    namespace "com.jellify"
    defaultConfig {
        applicationId "com.cosmonautical.jellify"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 170
        versionName "1.0.11"
        resValue "string", "build_config_package", "com.jellify"
    }
    signingConfigs {
        debug {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
        release {
            if (keystoreExists && envKeystorePassword && envKeyAlias && envKeyPassword) {
                println("Using release keystore")
                storeFile keystoreFile
                storePassword envKeystorePassword
                keyAlias envKeyAlias
                keyPassword envKeyPassword
            } else {
                println("Using debug keystore")
                storeFile file('debug.keystore')
                storePassword 'android'
                keyAlias 'androiddebugkey'
                keyPassword 'android'
            }
        }
    }
    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
        release {
            signingConfig signingConfigs.release
            minifyEnabled enableProguardInReleaseBuilds
            proguardFiles getDefaultProguardFile("proguard-android.txt"), "proguard-rules.pro"
        }
    }
    splits {
        abi {
            reset()
            enable enableSeparateBuildPerCPUArchitecture
            universalApk true
            include (*reactNativeArchitectures())
        }
    }
}

dependencies {
    implementation("com.facebook.react:react-android")
    implementation "com.google.android.gms:play-services-cast-framework:+"
    implementation("com.facebook.react:hermes-android")

    // Observation-only connection API. This does not register a CarAppService
    // or advertise WardenFM under a non-media Android Auto category.
    implementation("androidx.car.app:app:1.7.0")
}
